readiness:
  # regex-style patterns, evaluated deterministically
  drink_now: ["drink now", "drink it now", "ready now", "ready to drink", "drinking now", "now drink", "drink up", "enjoy now", "enjoy it now", "drink soon", "drink over the next", "should be drunk now", "drink within", "best now", "best drunk now", "best enjoyed now", "best consumed now", "drink this now"]
  can_age: ["will age", "ageworthy", "age-worthy", "needs time", "cellar", "cellaring", "will improve", "improve with age", "age for", "age until", "should age", "age well", "ages well", "built to age", "needs aging", "needs ageing", "give it time", "give it a few years", "will develop", "will evolve", "will reward", "will benefit", "needs to age", "needs to develop", "too young", "very young", "still young", "still tight", "still closed", "needs a few years", "needs several years", "be patient", "lay down", "lay it down", "can age", "can cellar", "will keep", "long term", "long-term", "aging potential", "ageing potential", "potential for aging", "potential for ageing"]
  year_range_regex: "\\b(?:drink|best|enjoy|hold|cellar|age|through|until|from|by|between|after|before)\\b\\D{0,20}?((?:19|20)\\d{2})(?:\\s*(?:-|–|—|to|through|until|and)\\s*((?:19|20)\\d{2}|\\d{2}))?"
