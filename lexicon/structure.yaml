# Structure cues -> ordinal level (WSET-style scales), plus negation-aware matching.
# Scales follow the WSET SAT levels (low / medium(-) / medium / medium(+) / high etc.)
# encoded as integers: 1=low .. 5=high for 5-point scales; sweetness 1=dry .. 5=luscious.
# Cue strengths are heuristic assumptions of THIS project; they can be tuned.
version: 1
