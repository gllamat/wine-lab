# Aroma/flavour lexicon aligned to the WSET Level 4 Systematic Approach to Tasting Wine, Issue 1.2 (Aug 2023) Wine-Lexicon.
# Taxonomy (3 tiers, 18 clusters, SAT descriptors) follows the card; surface-form synonym lists are project-written.
# Descriptors ending _generic / "other" extras are NOT SAT descriptors: they carry cluster-level evidence only.
# Clusters tertiary_red / tertiary_white are colour-resolved (wsetkit._resolve, suffix _red/_white).
# A surface form may sit under several clusters (toast, chocolate, cheese, almond ...): all candidates are kept unless colour rules one out.
# Earlier L3 (2016) version archived in lexicon/archive/.
