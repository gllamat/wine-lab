# Aroma/flavour lexicon aligned to the WSET Level 3 Systematic Approach to Tasting Wine (3W v2.0, June 2016) Wine-Lexicon.
# Taxonomy (3 tiers, 20 clusters) follows the SAT; surface-form synonym lists are project-written.
# cluster -> descriptor -> surface forms. Clusters ending _white/_red are colour-resolved (see wsetkit._resolve).
# One surface form may appear under several clusters (e.g. toast, chocolate, cheese): all candidates are kept
# unless the wine colour rules out a _white/_red variant.
