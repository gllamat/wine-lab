name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/core.txt
      - name: Install Python requirements
        run: pip install -r requirements/core.txt
      - name: Python syntax
        run: python -m compileall -q src scripts
      - name: JavaScript syntax
        run: |
          for f in dashboard/*.js; do node --check "$f"; done
      - name: Smoke test (matcher on fixed notes)
        run: python scripts/smoke.py
      - name: Causal tools, Python vs JavaScript parity
        run: |
          mkdir -p outputs
          python src/causal.py export
          python src/causal.py fixture
          node dashboard/causal_parity.js
